<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060B19"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="30%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#3C78AA" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3C78AA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="78%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#C2A633" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#C2A633" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7BB2E0"/>
      <stop offset="100%" stop-color="#3C78AA"/>
    </linearGradient>
    <linearGradient id="qo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E7C654"/>
      <stop offset="100%" stop-color="#C2A633"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>
  <g font-family="'DM Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="600" y="310" text-anchor="middle" font-weight="700" font-size="200" letter-spacing="-6">
      <tspan fill="url(#pay)">Pay</tspan><tspan fill="url(#qo)">qo</tspan>
    </text>
    <text x="600" y="410" text-anchor="middle" font-weight="500" font-size="38" fill="#C7D2E0" letter-spacing="0.5">
